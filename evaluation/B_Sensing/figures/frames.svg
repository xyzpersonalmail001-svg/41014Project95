<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
<title id="title">World, robot, camera, marker and LiDAR coordinate frames</title>
<desc id="description">Known station and sensor mounting transforms combine with image pose to estimate robot pose. LiDAR points use the estimated robot transform, not simulator truth.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#244d62"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172c3b;font-size:17px}.heading{font-size:23px;font-weight:700}.small{font-size:15px}rect{fill:#f5f9fb;stroke:#8094a1;stroke-width:1.5}.link{fill:none;stroke:#244d62;stroke-width:2;marker-end:url(#arrow)}</style>
<path class="link" d="M135 115V35H1065V115"/><text x="600" y="25" text-anchor="middle">Known station installation: T_WM</text>
<rect x="20" y="115" width="230" height="120" rx="5"/><text class="heading" x="135" y="151" text-anchor="middle">World W</text><text x="135" y="181" text-anchor="middle">Map x, y in metres</text><text x="135" y="210" text-anchor="middle">Robot yaw about +z</text>
<rect x="330" y="115" width="230" height="120" rx="5"/><text class="heading" x="445" y="151" text-anchor="middle">Robot base B</text><text x="445" y="181" text-anchor="middle">x forward · y left · z up</text><text x="445" y="210" text-anchor="middle">q̂ = [x̂, ŷ, θ̂]</text>
<rect x="640" y="115" width="230" height="120" rx="5"/><text class="heading" x="755" y="151" text-anchor="middle">Camera C</text><text class="small" x="755" y="181" text-anchor="middle">x right · y down · z forward</text><text class="small" x="755" y="210" text-anchor="middle">B position [0.10, 0, 0.17] m</text>
<rect x="950" y="115" width="230" height="120" rx="5"/><text class="heading" x="1065" y="151" text-anchor="middle">Marker M</text><text x="1065" y="181" text-anchor="middle">Known oriented station tag</text><text x="1065" y="210" text-anchor="middle">0.20 m black-border side</text>
<path class="link" d="M250 175H330"/><text class="small" x="290" y="259" text-anchor="middle">Estimated T_WB</text>
<path class="link" d="M560 175H640"/><text class="small" x="600" y="94" text-anchor="middle">Fixed T_BC</text>
<path class="link" d="M870 175H950"/><text class="small" x="910" y="259" text-anchor="middle">Image T_CM</text>
<rect x="330" y="330" width="230" height="105" rx="5"/><text class="heading" x="445" y="364" text-anchor="middle">LiDAR L</text><text x="445" y="394" text-anchor="middle">x forward · y left · z up</text><text class="small" x="445" y="420" text-anchor="middle">B position [−0.049, 0, 0.17] m</text>
<path class="link" d="M445 235V330"/><text x="467" y="299">Fixed T_BL</text>
<text x="610" y="338">T_AB maps coordinates in B into A.</text>
<text x="610" y="374">Image pose: T_WB = T_WM (T_CM)⁻¹ (T_BC)⁻¹</text>
<text x="610" y="409">Map a scan: p_W = T̂_WB T_BL p_L</text>
<text x="600" y="489" text-anchor="middle">Camera mounting and station map are declared priors. The application uses estimated robot pose.</text>
<text x="600" y="519" text-anchor="middle">Simulator robot truth is recorded separately for evaluation; it is not a control input.</text>
</svg>
